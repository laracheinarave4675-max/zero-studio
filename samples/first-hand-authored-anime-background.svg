<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>ZERO STUDIO — Evening at the old bookshop</title>
<desc>Original hand-authored layered anime background illustration: a quiet Japanese shopping street at blue hour, warm bookshop light, overhead cables, tiled roofs, trees, bicycles and wet pavement.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#182a4b"/><stop offset=".52" stop-color="#526887"/><stop offset="1" stop-color="#e7a77d"/></linearGradient>
 <linearGradient id="road" x2="0" y2="1"><stop stop-color="#596575"/><stop offset="1" stop-color="#1d293b"/></linearGradient>
 <linearGradient id="shopLight" x2="0" y2="1"><stop stop-color="#ffe8a5"/><stop offset="1" stop-color="#d98c50"/></linearGradient>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#e9d9bd"/><stop offset="1" stop-color="#ad9277"/></linearGradient>
 <linearGradient id="shadow" x2="0" y2="1"><stop stop-color="#26364c" stop-opacity=".1"/><stop offset="1" stop-color="#101b30" stop-opacity=".65"/></linearGradient>
 <pattern id="tiles" width="38" height="18" patternUnits="userSpaceOnUse"><path d="M0 9 Q9 -1 19 9 Q28 19 38 9" fill="none" stroke="#65565a" stroke-width="2" opacity=".65"/></pattern>
 <pattern id="brick" width="54" height="26" patternUnits="userSpaceOnUse"><path d="M0 0H54M0 13H54M27 0V13M0 13V26M54 13V26" fill="none" stroke="#8e7b6d" stroke-width="1" opacity=".3"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
