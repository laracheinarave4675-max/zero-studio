<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>ZERO STUDIO — The old house beneath the cedar canopy</title>
<desc>Original layered, editable anime-background study: a weathered Japanese timber house in a deep green forest, hand-authored paths, curved tiled roof, layered foliage, stone wall, warm late-afternoon light and atmospheric depth. No generative image model used.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8baeb0"/><stop offset=".48" stop-color="#c5c9a8"/><stop offset="1" stop-color="#e6c58e"/></linearGradient>
 <linearGradient id="mist" x2="0" y2="1"><stop stop-color="#d7dfc1" stop-opacity="0"/><stop offset="1" stop-color="#e8d6ad" stop-opacity=".72"/></linearGradient>
 <linearGradient id="plaster" x2=".2" y2="1"><stop stop-color="#e7d9b8"/><stop offset=".55" stop-color="#c8b58f"/><stop offset="1" stop-color="#927e67"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#92704c"/><stop offset=".35" stop-color="#6c5039"/><stop offset="1" stop-color="#382f2a"/></linearGradient>
 <linearGradient id="roof" x2=".15" y2="1"><stop stop-color="#596665"/><stop offset=".4" stop-color="#3e4c4c"/><stop offset="1" stop-color="#202f34"/></linearGradient>
 <linearGradient id="tileLight" x2="0" y2="1"><stop stop-color="#92958a"/><stop offset="1" stop-color="#424e4c"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#d6dfc0"/><stop offset=".4" stop-color="#91b3a7"/><stop offset="1" stop-color="#486b68"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#b5a98f"/><stop offset=".45" stop-color="#827e6c"/><stop offset="1" stop-color="#4e5952"/></linearGradient>
 <linearGradient id="path" x2="0" y2="1"><stop stop-color="#a99c7d"/><stop offset="1" stop-color="#59645a"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff5d4" stop-opacity=".92"/><stop offset=".4" stop-color="#f3d49b" stop-opacity=".42"/><stop offset="1" stop-color="#f3d49b" stop-opacity="0"/></radialGradient>
 <radialGradient id="leaf"><stop stop-color="#b7c47b"/><stop offset=".52" stop-color="#64885a"/><stop offset="1" stop-color="#294b3d"/></radialGradient>
 <pattern id="roofTiles" width="54" height="31" patternUnits="userSpaceOnUse"><path d="M0 0 Q13 7 27 0 Q40 7 54 0 M-27 15 Q0 23 27 15 Q54 23 81 15" fill="none" stroke="#b2b5a1" stroke-opacity=".45" stroke-width="2"/><path d="M27 0v15M0 15v16M54 15v16" stroke="#202f34" stroke-opacity=".5" stroke-width="2"/><path d="M4 5q9 5 17 1" fill="none" stroke="#d1c9a9" stroke-opacity=".22" stroke-width="2"/></pattern>
 <pattern id="woodgrain" width="120" height="42" patternUnits="userSpaceOnUse"><path d="M0 9q25-8 48 0t72-2M0 28q32-7 57 0t63-3" fill="none" stroke="#d2ae7c" stroke-opacity=".2" stroke-width="2"/><path d="M18 0q-5 18 3 42M91 0q-8 20 2 42" stroke="#302b28" stroke-opacity=".18" fill="none"/></pattern>
 <pattern id="stonegrain" width="74" height="48" patternUnits="userSpaceOnUse"><path d="M5 12l13-4 9 7-5 8-16-2zM42 5l19 2 5 9-13 8-12-7zM24 34l15-5 10 8-7 9-18-2z" fill="none" stroke="#e0d5b9" stroke-opacity=".24" stroke-width="2"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" seed="8" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
