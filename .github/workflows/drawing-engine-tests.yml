name: Drawing engine tests
on:
  push:
    branches: ["main", "feature/**", "feat/**"]
  pull_request:
    branches: ["main", "feature/**", "feat/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @napi-rs/canvas
      - run: node --check app/app.js && node --check app/api/images.js && node --check app/character-model.mjs && node --check app/character-library.mjs && node --check app/backgrounds.mjs && node --check app/engine.mjs && node --check app/zip.mjs && node --check app/gemini-drawing.mjs
      - run: node --check app/digital-artist-vision-contract.mjs && node --check app/digital-artist-vision-brush-planner.mjs && node --check app/digital-artist-corrections.mjs && node --check app/digital-artist-engine.mjs && node --check app/digital-artist-brush-engine.mjs && node --check app/digital-artist-brush-executor.mjs && node --check app/anime-auto-drawing-engine.mjs && node --check app/anime-motion-engine.mjs && node --check app/anime-anatomy-engine.mjs && node --check app/raster-brushes.mjs && node --check app/raster-environment-media.mjs && node --check app/raster-surface.mjs && node --check app/scene-production.mjs && node --check app/animation-production.mjs && node --check app/frame-history.mjs && node --check app/animation-worker.mjs && node --check app/sw.js && node --check app/anime-style-profile.mjs && node --check app/anime-head-turn-study.mjs
      - run: node --test tests/*.test.mjs
