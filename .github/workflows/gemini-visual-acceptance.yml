name: Gemini visual acceptance
on:
  push:
    branches: ["feature/fixed-background-visual-review"]
    paths:
      - "app/**"
      - "scripts/gemini-visual-acceptance.mjs"
      - ".github/workflows/gemini-visual-acceptance.yml"
jobs:
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install SVG rasterizer
        run: npm install --no-save @resvg/resvg-js
      - name: Generate and visually critique three anime backgrounds with Gemini
        run: node scripts/gemini-visual-acceptance.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save SVG, PNG previews and critique reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-visual-acceptance
          path: artifacts/gemini-visual-acceptance/
          if-no-files-found: warn
          retention-days: 30
