name: Hybrid raster and SVG regression tests

on:
  push:
    branches:
      - feat/hybrid-human-art-pipeline
      - feat/digital-artist-engine
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check application modules
        run: |
          set -e
          for file in app/*.mjs; do node --check "$file"; done
          node --check app/app.js
      - name: Run all native Node.js tests
        run: node --test tests/*.test.mjs

  raster-brush-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native Canvas2D renderer
        run: npm install --no-save --no-package-lock @napi-rs/canvas
      - name: Render the five native raster brushes
        run: node scripts/render-raster-brush-proof.mjs
      - name: Render the deterministic Digital Artist portrait
        run: node scripts/render-digital-artist-demo.mjs
      - name: Render the general anime drawing quality benchmark
        run: node scripts/render-digital-artist-anime-quality.mjs
      - name: Render the selected three-view anime character with native raster brushes
        run: node scripts/render-digital-artist-character-sheet.mjs
      - name: Upload brush proof sheet
        uses: actions/upload-artifact@v4
        with:
          name: zero-studio-raster-brush-proof
          path: artifacts/raster-brush-proof/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Digital Artist portrait proof
        uses: actions/upload-artifact@v4
        with:
          name: zero-studio-digital-artist-portrait-proof
          path: artifacts/digital-artist-portrait-proof/
          if-no-files-found: error
          retention-days: 14
      - name: Upload general anime drawing quality proof
        uses: actions/upload-artifact@v4
        with:
          name: zero-studio-anime-quality-benchmark
          path: artifacts/digital-artist-anime-quality-proof/
          if-no-files-found: error
          retention-days: 14
      - name: Upload selected character three-view brush proof
        uses: actions/upload-artifact@v4
        with:
          name: zero-studio-character-sheet-brush-proof
          path: artifacts/digital-artist-character-sheet-proof/
          if-no-files-found: error
          retention-days: 14
