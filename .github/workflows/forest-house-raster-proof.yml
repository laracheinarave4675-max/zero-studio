name: ZERO STUDIO deterministic forest-house visual proof
on:
  push:
    branches: ["feat/hybrid-human-art-pipeline"]
    paths:
      - "scripts/render-forest-house-proof.mjs"
      - ".github/workflows/forest-house-raster-proof.yml"
      - "app/anime-background-painter.mjs"
      - "app/painterly-forest-pass.mjs"
      - "app/engine.mjs"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp
      - name: Render the repository's deterministic forest-house painter
        run: node scripts/render-forest-house-proof.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zero-studio-forest-house-visual-proof
          path: artifacts/forest-house-proof/
          if-no-files-found: error
          retention-days: 14
