name: Gemini 3.8 Flash premium anime background test
on:
  push:
    branches: ["feature/mobile-drawing-workspace"]
    paths:
      - "scripts/run-gemini-3-8-flash-rural-scene.mjs"
      - "app/scene-production.mjs"
      - ".github/workflows/gemini-3-8-flash-rural-scene.yml"
  workflow_dispatch:
concurrency:
  group: zero-studio-gemini-3-8-flash-rural-scene
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install SVG preview renderer
        run: npm install --no-save @resvg/resvg-js
      - name: Generate, critique, and revise one premium scene with Gemini 3.8 Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/run-gemini-3-8-flash-rural-scene.mjs
      - name: Upload editable vector drafts and critiques
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-studio-gemini-3-8-flash-rural-scene
          path: artifacts/gemini-3-8-flash-rural-scene/
          if-no-files-found: warn
          retention-days: 14
