name: Cloud inference worker tests

on:
  push:
    branches: [feat/hybrid-human-art-pipeline, feat/production-gallery]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker-tests.yml"
  pull_request:
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cloudflare-worker/tests/*.test.mjs
